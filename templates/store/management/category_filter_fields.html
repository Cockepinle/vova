{{ filter_form.non_field_errors }}
<div class="form-grid">
  {% for field in filter_form %}
    <label class="{% if field.name == 'choices_text' %}full{% elif field.field.widget.input_type == 'checkbox' %}filter-checkbox{% endif %}">
      <span>{{ field.label }}</span>
      {{ field }}
      {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
      {{ field.errors }}
    </label>
  {% endfor %}
</div>
