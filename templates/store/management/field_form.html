{% extends "store/management/base.html" %}

{% block heading %}{% if field %}Редактировать поле{% else %}Добавить поле{% endif %}{% endblock %}

{% block content %}
  <form class="mgmt-card mgmt-form" method="post">
    {% csrf_token %}
    {{ form.non_field_errors }}
    <div class="form-grid">
      {% for item in form %}
        <label class="{% if item.name == 'choices_text' %}full choice-options-field{% elif item.name == 'filter_type' %}filter-type-field{% endif %}">
          <span>{{ item.label }}</span>
          {{ item }}
          {% if item.name == 'choices_text' %}
            <small>Заполняется только для типа «Список». Например: Белый, Чёрный, Прозрачный — каждый вариант с новой строки.</small>
          {% endif %}
          {{ item.errors }}
        </label>
      {% endfor %}
    </div>
    <div class="form-actions">
      <button class="primary-button" type="submit">Сохранить поле</button>
      <a class="ghost-button" href="{% url 'management_fields' %}">Отмена</a>
    </div>
  </form>

  <script>
    const typeField = document.querySelector("#id_value_type");
    const choicesField = document.querySelector(".choice-options-field");
    const filterableField = document.querySelector("#id_is_filterable");
    const filterTypeField = document.querySelector(".filter-type-field");
    const filterModeField = document.querySelector("#id_filter_type");

    function toggleChoicesField() {
      if (typeField && choicesField) choicesField.style.display = typeField.value === "choice" ? "grid" : "none";
      if (filterableField && filterTypeField) filterTypeField.style.display = filterableField.checked ? "grid" : "none";
      if (filterModeField) {
        const multiple = filterModeField.querySelector('option[value="multiple"]');
        const range = filterModeField.querySelector('option[value="range"]');
        if (multiple) multiple.disabled = typeField.value !== "choice";
        if (range) range.disabled = !["integer", "decimal", "price"].includes(typeField.value);
        if (multiple?.selected && multiple.disabled || range?.selected && range.disabled) filterModeField.value = "single";
      }
    }

    typeField?.addEventListener("change", toggleChoicesField);
    filterableField?.addEventListener("change", toggleChoicesField);
    filterModeField?.addEventListener("change", toggleChoicesField);
    toggleChoicesField();
  </script>
{% endblock %}
